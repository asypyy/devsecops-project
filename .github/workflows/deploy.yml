name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Build Backend Docker image
        run: docker build -t devsecops-api:latest .

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-api:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Build Frontend Docker image
        run: docker build -t devsecops-frontend:latest ./frontend

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-frontend:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_TAILSCALE_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/devsecops-project
            git pull origin main
            minikube start --driver=docker || true
            eval $(minikube docker-env)
            docker build -t devsecops-api:latest .
            docker build -t devsecops-frontend:latest ./frontend
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml
            kubectl apply -f k8s/frontend-deployment.yaml
            kubectl apply -f k8s/frontend-service.yaml
            kubectl apply -f k8s/prometheus-deployment.yaml
            kubectl apply -f k8s/prometheus-service.yaml
            kubectl apply -f k8s/grafana-deployment.yaml
            kubectl apply -f k8s/grafana-service.yaml
            kubectl rollout restart deployment/notes-api
            kubectl rollout restart deployment/notes-frontend
            kubectl rollout status deployment/notes-api --timeout=60s
            kubectl rollout status deployment/notes-frontend --timeout=60s
            sleep 15

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://aserver.tail5c3f3c.ts.net/health'
          fail_action: false

