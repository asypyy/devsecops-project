name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: Build Backend Docker image
        run: docker build -t devsecops-api:latest .

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-api:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Build Frontend Docker image
        run: docker build -t devsecops-frontend:latest ./frontend

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-frontend:latest
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Generate Backend SBOM with Syft
        uses: anchore/sbom-action@v0.18.0
        with:
          image: devsecops-api:latest
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Upload Backend SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-spdx
          path: backend-sbom.spdx.json

      - name: Install Cosign Supply Chain Security
        uses: sigstore/cosign-installer@v3.5.0



